name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15
          cache: npm

      - name: Upgrade npm
        run: npm install -g "npm@==12.2.0"

      - name: Install dependencies
        run: npm ci

      - name: lint (non-blocking)
        continue-on-error: true
        run: npm run lint || { echo "::warning title=ESLint::lint errors found (non-blocking, see step log)"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15
          cache: npm

      - name: Upgrade npm
        run: npm install -g "npm@==12.2.0"

      - name: Install dependencies
        run: npm ci

      - name: build
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build
